{% extends "base.html" %}
{% block body %}
<div class="card">
  <h2>確認メール再送 / Resend confirmation</h2>
  {% if error %}<div class="gps err">{{ error }}</div>{% endif %}
  <form method="post" action="/resend">
    <label>メール <span class="ja">／ Your email</span></label>
    <input type="email" name="email" autocapitalize="none" autocomplete="email" required>
    <button type="submit">リンクを送る / Send link</button>
  </form>
  <p class="hint" style="margin-top:12px"><a href="/login">← ログインへ戻る / Back to sign in</a></p>
</div>
{% endblock %}
