{% extends "base.html" %}
{% block body %}
<div class="card">
  <h2>Edit user / 利用者の編集 — {{ u.username }}{% if u.username == me %} <small>(you / 自分)</small>{% endif %}</h2>
  <form method="post" action="/admin/users/{{ u.username }}/edit">
    <label title="Name shown on records. Note: existing records keep the old name / 記録に表示される名前。既存記録は旧名のまま">Display name <span class="ja">／ 表示名</span></label>
    <input type="text" name="display_name" value="{{ u.display_name or '' }}">

    <label>Email <span class="ja">／ メール</span></label>
    <input type="text" name="email" value="{{ u.email or '' }}" inputmode="email">

    <label title="Leave blank to keep the current password / 空欄なら現在のパスワードを維持">Reset password <span class="ja">／ パスワード再設定</span></label>
    <input type="password" name="new_password" placeholder="leave blank = unchanged / 空欄で変更なし" autocomplete="new-password">
    <p class="hint">Username <span class="ja">／ ユーザー名</span> <b>{{ u.username }}</b> cannot be changed. / 変更不可。</p>

    <button type="submit">💾 Save / 保存</button>
  </form>
  <p style="margin-top:10px"><a href="/admin/users">← Back to users / 一覧に戻る</a></p>
</div>
{% endblock %}
