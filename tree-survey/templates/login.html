{% extends "base.html" %}
{% block body %}
<div class="card">
  <h2>ログイン / Sign in</h2>
  {% if error %}<div class="gps err">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <label>ユーザー名 <span class="ja">／ Username</span></label>
    <input type="text" name="username" autocapitalize="none" autocomplete="username" required>
    <label>パスワード <span class="ja">／ Password</span></label>
    <input type="password" name="password" autocomplete="current-password" required>
    <button type="submit">ログイン / Sign in</button>
  </form>
  {% if show_resend %}
  <p class="hint" style="margin-top:10px"><a href="/resend">確認メールを再送 / Resend confirmation email</a></p>
  {% endif %}
  <p class="hint" style="margin-top:12px"><a href="/register">新規登録はこちら → / New volunteer? Create an account</a></p>
</div>
{% endblock %}
